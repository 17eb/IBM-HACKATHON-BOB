[project]
name = "cobol-bridge-mcp"
version = "0.1.0"
description = "MCP proof harness for AI-assisted COBOL-to-Java modernization with exact parity checks"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp==1.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
demo = ["streamlit>=1.40"]

[tool.pytest.ini_options]
testpaths = ["tests"]
